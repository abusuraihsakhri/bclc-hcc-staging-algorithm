name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -q

      - name: CLI smoke tests
        run: |
          python cli.py single --tumor-count 1 --tumor-size-cm 6 --child-pugh-class A --ecog-ps 0 > /tmp/single.json
          grep -q '"bclc_stage": "A"' /tmp/single.json
          python cli.py batch -i sample.csv -o /tmp/bclc-results.csv
          test -s /tmp/bclc-results.csv
          python simulator.py 25

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify static app files
        run: |
          test -s index.html
          test -s bclc_staging.py
          grep -q 'pyodide/v0.29.5' index.html
          grep -q 'id="theme-toggle"' index.html
          grep -q 'data-theme="light"' index.html
          grep -q 'bclc-theme' index.html
          grep -q 'id="tab-input"' index.html
          grep -q '>Analyze case</button>' index.html
          grep -q 'analyzeVisible' index.html
          grep -q 'layoutFit' index.html

      - name: Start local site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/bclc-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bclc-http.log
          exit 1

      - name: Run Pyodide browser smoke test
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --virtual-time-budget=60000             --dump-dom "http://127.0.0.1:8000/?smoke=1" > /tmp/dom.html
          grep -q 'data-smoke="ok"' /tmp/dom.html
          grep -q 'data-analyze-ready="ok"' /tmp/dom.html

      - name: Verify compact device viewports do not scroll
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          for viewport in "390,844" "360,640" "844,390" "768,1024" "1366,768"; do
            echo "Testing viewport $viewport"
            safe_name="$(echo "$viewport" | tr ',' 'x')"
            success=false
            for attempt in 1 2 3; do
              if "$BROWSER" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --no-first-run \
                --force-device-scale-factor=1 \
                --window-size="$viewport" \
                --virtual-time-budget=2000 \
                --dump-dom "http://127.0.0.1:8000/?layouttest=1" > "/tmp/layout-$safe_name.html"; then
                success=true
                break
              fi
              echo "Chromium retry $attempt for $viewport"
              sleep 1
            done
            test "$success" = true
            if ! grep -q 'data-layout-fit="ok"' "/tmp/layout-$safe_name.html"; then
              grep -o 'data-layout-fit="[^"]*"' "/tmp/layout-$safe_name.html" || true
              exit 1
            fi
            if ! grep -q 'data-analyze-visible="ok"' "/tmp/layout-$safe_name.html"; then
              grep -o 'data-analyze-visible="[^"]*"' "/tmp/layout-$safe_name.html" || true
              exit 1
            fi
          done
